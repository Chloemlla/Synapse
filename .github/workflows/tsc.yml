name: Node Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-verify:
    name: Node verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 混淆产物冒烟要真正启动一次后端，而 MONGO_URI 是启动硬依赖（config.ts 无 URI 直接拒绝解析）。
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        # 跳过依赖安装脚本，避免未批准的本地构建
        # （bcrypt / @scarf/scarf / unrs-resolver 等）导致安装阶段退出。
        run: pnpm install --ignore-scripts

      - name: Audit policy static checks
        run: pnpm run check:audit-policies

      # 这道闸门必须跑在 `Run build` **之前**：`build:backend` 的第一条就是
      # `node scripts/generate-admin-spa-paths.js`（就地重生成清单），跑在它后面就只能拿
      # 「刚重生成的文件」与自己比，永远为绿——2026-10-02 就是这样漏掉了 /admin/debug-console
      # 的生成物漂移（模块表有、入库清单没有，CI 仍报 success）。放在这里比的才是**入库的**
      # 那份清单，漏重生成会真的失败；生成脚本只读源码、不需要构建产物。
      - name: SPA path drift gate (backend list vs frontend routes)
        # 清单由 frontend/src/components/admin/adminModules.tsx 与 frontend/src/App.tsx 共同生成
        # （管理模块页 + 全部前端路由）；漏更新时线上表现是页面深链被 308 到 API，
        # 只看现象很难反推到生成脚本。
        run: pnpm run check:admin-spa-paths

      # 同上必须跑在 build 之前：隐私政策页面直接渲染 src/generated/privacyDataMap.ts，
      # 而该文件由 docs/governance/privacy-data-map.json 生成；比入库的那一份才能抓到
      # 「改了数据地图却忘了重新生成」——否则页面会继续向用户描述旧的数据实践。
      - name: Privacy data map drift gate (policy page vs data contract)
        run: pnpm run check:privacy-data-map

      - name: Run build
        run: pnpm run build

      - name: Generate OpenAPI spec (validate swagger-jsdoc annotations)
        # openapi.json 被 .gitignore 忽略，产物不入库；在镜像构建前暴露 swagger-jsdoc 语法错误。
        run: pnpm run generate:openapi

      - name: OpenAPI drift gate (documented paths vs generated spec)
        # swagger-jsdoc 丢弃解析失败的注释块时不报错，端点会静默从 spec 里消失。
        run: pnpm run check:openapi-drift

      - name: Obfuscated artifact smoke (production boot of dist-obfuscated)
        # 生产镜像跑的是 dist-obfuscated；混淆破坏与生产模式启动断言只在运行时暴露。
        env:
          SMOKE_MONGO_URI: mongodb://127.0.0.1:27017/synapse_smoke
        run: pnpm run smoke:obfuscated

      - name: Tree-shaking config drift (advisory)
        # scripts/check-tree-shaking.js 只报告、从不失败：这里是可见性，不是门禁。
        run: pnpm run check:tree-shaking-config

      - name: Run backend Jest tests with coverage
        id: backend-tests
        run: pnpm run test:ci

      - name: Run frontend Vitest tests with coverage
        id: frontend-tests
        run: pnpm --dir frontend run test:ci

      - name: Report test step outcomes
        if: always()
        run: |
          {
            echo "## 单元测试结果（已入门禁）"
            echo ""
            echo "- Backend Jest (\`backend-tests\`): \`${{ steps.backend-tests.outcome }}\`"
            echo "- Frontend Vitest (\`frontend-tests\`): \`${{ steps.frontend-tests.outcome }}\`"
            echo ""
            echo "> 这两步从 2026-09-26 起不再挂着 \`continue-on-error\`：失败就红。"
            echo "> 在此之前它们被这个开关盖着：ts-jest 与 typescript@7 不兼容，让"
            echo "> 118 个后端套件静默停了六周（参 verified-methodology.md §五-62）。"
            echo "> 现在暴露出的失败都是那六周里攒下的存量欠账，不是本次改动引入的。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synapse-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/
            dist-obfuscated/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

  type-check-backend:
    name: type-check-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: TypeScript check backend
        run: npx tsc --noEmit --project tsconfig.json

  type-check-frontend:
    name: type-check-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: TypeScript check frontend
        run: pnpm --dir frontend run typecheck

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    needs: [type-check-backend, type-check-frontend]
    if: always()
    steps:
      - name: Check type-check-backend result
        if: needs.type-check-backend.result != 'success'
        run: |
          echo "type-check-backend result: ${{ needs.type-check-backend.result }}"
          exit 1

      - name: Check type-check-frontend result
        if: needs.type-check-frontend.result != 'success'
        run: |
          echo "type-check-frontend result: ${{ needs.type-check-frontend.result }}"
          exit 1

      - name: Report required type-check status
        run: echo type-check passed
