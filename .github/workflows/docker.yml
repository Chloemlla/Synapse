name: Docker

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Docker Build Verification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=5096
      NPM_CONFIG_CACHE: /tmp/.npm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          BUILDKIT_MEM_LIMIT: 13g
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: synapse:pr-check
          build-args: |
            NODE_OPTIONS=--max-old-space-size=13000
            GIT_SHA=${{ github.sha }}
          no-cache: true

      - name: Verify build success
        run: |
          echo "Docker image build completed successfully."
          echo "Platform: linux/amd64"

  publish-amd64:
    name: Publish Docker (amd64)
    if: >
      github.event_name != 'pull_request' &&
      (
        github.actor == 'SynapticArch' ||
        github.actor == 'actions-user' ||
        github.actor == 'Chloemlla'
      ) &&
      !contains(github.event.head_commit.message || '', 'npm(deps):')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_OPTIONS: --max-old-space-size=5096
      NPM_CONFIG_CACHE: /tmp/.npm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare tags
        id: tags
        run: |
          TAGS=$(cat <<EOF
          happyclo/tts-node:${{ github.ref_name }}-amd64
          happyclo/tts-node:${{ steps.meta.outputs.short_sha }}-amd64
          EOF
          )

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare buildx cache dirs
        run: |
          mkdir -p /tmp/.buildx-cache
          mkdir -p /tmp/.buildx-cache-new

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          BUILDKIT_MEM_LIMIT: 13g
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NODE_OPTIONS=--max-old-space-size=13000
            GIT_SHA=${{ github.sha }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=gha
            type=registry,ref=happyclo/tts-node:cache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=gha,mode=min
            type=registry,ref=happyclo/tts-node:cache,mode=min
          tags: ${{ steps.tags.outputs.tags }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy-amd64:
    name: Deploy AMD64 image
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: publish-amd64
    if: >
      github.event_name != 'pull_request' &&
      (
        github.actor == 'SynapticArch' ||
        github.actor == 'actions-user' ||
        github.actor == 'Chloemlla'
      ) &&
      needs['publish-amd64'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set script permissions
        run: chmod +x scripts/deploy_image.js

      - name: Compute image tag
        id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run deployment script
        env:
          SERVER_ADDRESS: ${{ secrets.SERVER_ADDRESS }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTAINER_NAMES: ${{ secrets.CONTAINER_NAMES }}
          IMAGE_URL: happyclo/tts-node:${{ steps.meta.outputs.short_sha }}-amd64
          SERVER_HOST_KEY_SHA256: ${{ secrets.SERVER_HOST_KEY_SHA256 }}
        run: node scripts/deploy_image.js

      - name: Preserve deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy.log
          retention-days: 3
          if-no-files-found: ignore
