overrides:
  qs: '>=6.14.2'
  ajv: '>=8.18.0'
  diff: '>=4.0.4'
  # 安全下限（GHSA-23c5-xmqv-rm74 修在 10.2.1），但不能无上界：swagger-jsdoc 6.3.0 →
  # glob@11.1.0 只声明支持 minimatch ^10，被这条 override 解到 11.0.5 之后 glob 的
  # magic 匹配整套失效（glob.sync('/abs/**/*.ts') 恒返回 []），scripts/generate-openapi.js
  # 于是扫不到任何 @openapi 注释，产出 paths 为空的 openapi.json，
  # /api/openapi.json 与 API 文档页跟着空白（Node Verification 的 drift gate 报
  # "spec declares zero paths"）。glob@11 单独钉回 10.x，glob@13 继续吃 11.x。
  minimatch: '>=10.2.1'
  'glob@^11>minimatch': '>=10.2.1 <11'
  undici: '>=8.9.0'
  js-yaml: '>=5.2.2'
  tar: '>=7.5.21'
  ip-address: '>=10.3.1'
  fast-uri: '>=3.1.5'
  brace-expansion: '>=5.0.9'
  # GHSA shell-quote quadratic DoS in parse(); fixed in >=1.9.0 (via concurrently)
  shell-quote: '>=1.9.0'

allowBuilds:
  '@cathodique/mmap-io': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  unrs-resolver: true
