name: Update Lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependabot-maintenance.yml"
      - "scripts/fix-dependabot-alerts.js"
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      action:
        description: Security maintenance action
        required: true
        type: choice
        options:
          - fix-alerts
          - repair-lockfiles
          - rebase
          - recreate

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: read

jobs:
  fix-alerts:
    name: Fix Security Alerts
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.action == 'fix-alerts' || inputs.action == 'repair-lockfiles'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version

      - name: Run fix script
        if: inputs.action != 'repair-lockfiles'
        env:
          # USER_PAT is optional read-only access for Dependabot alerts only.
          # Prefer a fine-grained PAT with Dependabot alerts:read and no write scopes.
          # If unset, GITHUB_TOKEN is used (may lack Dependabot alerts access).
          USER_PAT: ${{ secrets.USER_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--all-targets"
          fi
          node scripts/fix-dependabot-alerts.js $ARGS

      - name: Repair lockfiles
        if: inputs.action == 'repair-lockfiles'
        env:
          USER_PAT: ${{ secrets.USER_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/fix-dependabot-alerts.js --repair

      - name: Create pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          ACTION_NAME="${{ inputs.action }}"
          if [ -z "$ACTION_NAME" ]; then
            ACTION_NAME="fix-alerts"
          fi
          BRANCH="dependabot-maintenance/${ACTION_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"

          if [ "$ACTION_NAME" = "repair-lockfiles" ]; then
            git commit -m "fix: repair pnpm lockfiles to match current package.json"
            TITLE="fix: repair pnpm lockfiles to match current package.json"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "chore: upgrade all npm dependencies"
            TITLE="chore: upgrade all npm dependencies"
          else
            git commit -m "fix: auto-fix Dependabot and CodeQL security alerts"
            TITLE="fix: auto-fix Dependabot and CodeQL security alerts"
          fi
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Automated security maintenance changes (Dependabot and/or CodeQL) generated by the workflow.")
          gh pr merge "$PR_URL" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}

  manage-prs:
    name: Manage Dependabot PRs
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'fix-alerts' && inputs.action != 'repair-lockfiles'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version

      - name: Run selected maintenance action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPENDABOT_ACTION: ${{ inputs.action }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const https = require('node:https');

          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const action = process.env.DEPENDABOT_ACTION;
          const [owner, repo] = repository.split('/');
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;

          function request(path, method = 'GET', body = null) {
            return new Promise((resolve, reject) => {
              const payload = body ? JSON.stringify(body) : null;
              const req = https.request(
                {
                  hostname: 'api.github.com',
                  path,
                  method,
                  headers: {
                    'User-Agent': 'dependabot-maintenance',
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.github+json',
                    'Content-Type': 'application/json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    ...(payload ? { 'Content-Length': Buffer.byteLength(payload) } : {}),
                  },
                },
                (res) => {
                  let data = '';
                  res.on('data', (chunk) => {
                    data += chunk;
                  });
                  res.on('end', () => {
                    const parsed = data ? JSON.parse(data) : null;
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      resolve(parsed);
                      return;
                    }

                    reject(
                      new Error(
                        `GitHub API ${method} ${path} failed: ${res.statusCode} ${data || '<empty>'}`
                      )
                    );
                  });
                }
              );

              req.on('error', reject);

              if (payload) {
                req.write(payload);
              }

              req.end();
            });
          }

          function appendSummary(lines) {
            if (!summaryFile) {
              return;
            }

            fs.appendFileSync(summaryFile, `${lines.join('\n')}\n`, 'utf8');
          }

          async function listDependabotPRs() {
            const prs = await request(`/repos/${owner}/${repo}/pulls?state=open&per_page=100`);
            return prs.filter((pr) => pr.user?.login === 'dependabot[bot]');
          }

          async function commentOnPR(pr, body) {
            await request(
              `/repos/${owner}/${repo}/issues/${pr.number}/comments`,
              'POST',
              { body }
            );
          }

          (async () => {
            if (action !== 'rebase' && action !== 'recreate') {
              throw new Error(`Unsupported action: ${action}. Direct merge from this workflow is intentionally disabled; use auto-merge after required checks and human approval.`);
            }

            const prs = await listDependabotPRs();
            console.log(`Found ${prs.length} open Dependabot PR(s).`);

            if (prs.length === 0) {
              appendSummary([
                '## Dependabot Maintenance',
                '',
                `Action: \`${action}\``,
                '',
                'No open Dependabot PRs found.',
              ]);
              return;
            }

            const results = [];

            for (const pr of prs) {
              const command = `@dependabot ${action}`;
              await commentOnPR(pr, command);
              console.log(`Commented "${command}" on PR #${pr.number}.`);
              results.push({
                number: pr.number,
                title: pr.title,
                status: 'commented',
                reason: command,
              });
            }

            appendSummary([
              '## Dependabot Maintenance',
              '',
              `Action: \`${action}\``,
              '',
              `Processed PRs: ${results.length}`,
              `Commented: ${results.length}`,
              'Merged: 0',
              'Skipped: 0',
              'Failed: 0',
            ]);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
