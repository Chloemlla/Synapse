name: Nightly Test Matrix

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  nightly-live:
    name: Nightly live / integration slice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Start MongoDB replica set
        id: mongo
        shell: bash
        run: |
          docker run -d --name mongo-nightly -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          # 容器刚起时首轮探测必然 ECONNREFUSED。把重试期间的 mongosh 报错挡在日志外：
          # 这条噪音曾被当成「runner 没有 MongoDB 服务」误判过一次真实失败的根因。
          for attempt in $(seq 1 30); do
            if docker exec mongo-nightly mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec mongo-nightly mongosh --quiet --eval 'try { rs.initiate({_id:"rs0", members:[{_id:0, host:"127.0.0.1:27017"}]}) } catch (e) { if (!String(e.message || e).includes("already initialized")) throw e }'
          for attempt in $(seq 1 30); do
            if docker exec mongo-nightly mongosh --quiet --eval 'rs.isMaster().ismaster' 2>/dev/null | grep -qi true; then
              exit 0
            fi
            sleep 1
          done
          echo "Mongo replica set did not become primary"
          docker logs mongo-nightly || true
          exit 1

      - name: Run nightly MongoDB core contracts
        id: core
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/synapse_nightly
          JWT_SECRET: nightly-test-jwt-secret
          ADMIN_PASSWORD: nightly-admin-password
          TEST_ADMIN_PASSWORD: nightly-admin-password
        run: pnpm run test:nightly:core

      - name: Run external API matrix
        id: external
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/synapse_nightly
          JWT_SECRET: nightly-test-jwt-secret
          ADMIN_PASSWORD: nightly-admin-password
          TEST_ADMIN_PASSWORD: nightly-admin-password
          IP_QUERY_KEY: ${{ secrets.IP_QUERY_API_KEY }}
        run: pnpm run test:nightly:external

      - name: Report nightly outcome
        if: always()
        run: |
          {
            echo "## Nightly slice outcomes"
            echo ""
            echo "- MongoDB replica set: \`${{ steps.mongo.outcome }}\`"
            echo "- Core contracts: \`${{ steps.core.outcome }}\`"
            echo "- External API matrix: \`${{ steps.external.outcome }}\`"
            echo ""
            echo "> Mongo 启动成功只代表服务端已 PRIMARY，不代表应用驱动握手或认证通过。请查看失败步骤的首条异常。"
            echo "> 若出现 Missing required sub-document driver，检查 mongodb runtimeAdapters.os：Jest 的 CJS VM 可能无法执行驱动默认适配器中的动态导入。"
            echo "> Core contracts 必须实际执行成功；skipped 不算通过。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Jest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-test-logs
          path: |
            logs/**
            data/logs/**
          if-no-files-found: ignore
