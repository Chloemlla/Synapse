# Synapse 维护兜底页 —— 接入层片段
#
# 作用：上游（各站点容器）返回 502/503/504 时，直接吐静态维护页，而不是 openresty 的裸错误页。
# 页面本体：deploy/openresty/maintenance.html
#          服务器上落在 /opt/1panel/www/maintenance/maintenance.html（容器内 /www/maintenance/maintenance.html）
#
# 用法：放进站点的 proxy 目录，站点 server 块里的
#       `include /www/sites/<site>/proxy/*.conf;` 会把本文件并入 server 上下文；
#       文件名排序在 root.conf 之前，先声明 error_page 与命名 location。
#
# 说明：
# - error_page 放在 server 级，站点里所有 proxy 位置都吃同一条兜底规则；
# - `=503` 把上游的各种 5xx 统一收敛成「暂时不可用 + Retry-After」，这才是维护语义；
#   并且让前置 CDN 透传我们的页面，而不是换成它自己的 502 错误页；
# - @chloemlla_maintenance 是 internal 命名 location，外部无法直接访问这个页面；
# - Retry-After 与页面 <noscript> 里的 meta refresh 保持一致，便于无 JS 客户端与爬虫退避；
# - X-Maintenance-Page 只是版本探针，用来确认线上跑的是哪一版页面。

proxy_intercept_errors on;
error_page 502 503 504 =503 @chloemlla_maintenance;

location @chloemlla_maintenance {
    root /www/maintenance;
    try_files /maintenance.html =503;
    internal;
    charset utf-8;
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Maintenance-Page v4 always;
}
